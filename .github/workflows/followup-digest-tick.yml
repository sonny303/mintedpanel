name: Follow-up digest hourly tick

# MINT-108. The follow-up digest (GET /api/jobs/followup-digest) must be
# called every hour: each call sends to every org whose local hour has reached
# its send hour, once per org-local date (src/server/jobs/followupDigest.ts).
# Production is on Vercel's Hobby plan, which runs a cron at most once a day
# and fails a deploy with a more frequent one, so the hourly tick comes from
# here. vercel.json keeps one daily call at 18:00 UTC as a backup: GitHub runs
# schedules on the default branch only, and may delay or skip them under load.
#
# Setup (operator): set the repository secret CRON_SECRET to the same value as
# CRON_SECRET on the Vercel project the tick calls. Until it is set, every
# tick exits 0 with a notice. The optional repository variable
# FOLLOWUP_DIGEST_BASE_URL overrides the target origin (default: production).
#
# The bearer reaches the shell only through `env`, never interpolated into a
# script, and is never printed. The tick prints the HTTP status, the run's
# outcome and its integer counts, which carry no PHI.

on:
  schedule:
    # Seven past each hour, off the top of the hour when GitHub's scheduler is
    # busiest. The job keys each run on the UTC hour, so a late tick still
    # counts for its hour and a second call in the same hour is skipped.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: followup-digest-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Call the follow-up digest job
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/jobs/followup-digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.FOLLOWUP_DIGEST_BASE_URL || 'https://mintedpanel.com' }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice title=Follow-up digest tick::CRON_SECRET is not set, so no tick ran."
            exit 0
          fi
          case "${BASE_URL}" in
            https://*) ;;
            *)
              echo "::error title=Follow-up digest tick::FOLLOWUP_DIGEST_BASE_URL must start with https://"
              exit 1
              ;;
          esac
          body="$(mktemp)"
          code=0
          status="$(curl --silent --show-error --fail-with-body --max-time 60 \
            --output "${body}" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/jobs/followup-digest")" || code=$?
          summary="$(jq -c '{outcome: .data.outcome, counts: .data.counts, error: .error}' "${body}" 2>/dev/null)" \
            || summary='"not the job envelope"'
          rm -f "${body}"
          echo "HTTP ${status:-none}: ${summary}"
          exit "${code}"
