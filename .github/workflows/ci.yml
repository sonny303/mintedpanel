name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Gate 0.4 — migration dry-run against a throwaway Postgres (never a Supabase
  # branch or prod). Applies every file in supabase/migrations/ in filename order
  # after seeding the Supabase prerequisites the baseline assumes.
  migrations:
    name: Migration dry-run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -q && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Seed Supabase prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA public;
          SQL

      - name: Apply migrations in filename order
        run: |
          set -euo pipefail
          shopt -s nullglob failglob
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::apply $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

  # Gate 0.5 — Playwright smoke skeleton. Boots the app via the Vite dev server
  # with dummy Supabase env vars (unauthenticated paths make no network call).
  # Two specs run (login render, dashboard redirect); three write scenarios are
  # test.skip (need a seeded tenant).
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 (not 20): the SSR dev server constructs the Supabase client at
      # module load, and @supabase/realtime-js needs a global WebSocket, which
      # Node 20 lacks (added as a global in Node 22). On Node 20 SSR throws a 500
      # and the webServer never comes up. The build job stays on Node 20 — it only
      # builds, it never runs the server.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Write dummy Supabase env
        run: |
          cat > .env <<'ENV'
          VITE_SUPABASE_URL=https://example.supabase.co
          VITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci
          ENV

      - name: Run Playwright smoke skeleton
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
