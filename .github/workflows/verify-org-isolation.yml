name: Verify org isolation

# End-to-end multi-tenant isolation gate for the /api surface, run against a
# real deploy from a GitHub runner (open egress). The Claude sandbox cannot run
# it — its egress policy denies *.supabase.co and the deploy host. It never
# uses the service-role key: it signs in as real users with the anon key +
# passwords (service-role stays server-side on Vercel) and calls the deploy
# with each user's Bearer JWT.
#
# Triggers:
#   - deployment_status (automatic): fires on every deployment event the Vercel
#     GitHub integration reports. The `verify` job only RUNS when the deployment
#     succeeded AND its environment is production (contains() is
#     case-insensitive, so "Production" / "Production – <project>" both match).
#     Preview deploys still create a workflow run, but `verify` shows as
#     skipped — that is expected, not a failure. The `deployment-context` job
#     logs the exact environment string each event reported, so the guard can
#     be checked against reality at any time.
#   - workflow_dispatch (manual): unchanged. Optionally override API_BASE for
#     the run.
#
# deployment_status runs still hit API_BASE from repo secrets (the production
# alias), NOT the event's deployment URL — preview URLs sit behind Vercel SSO,
# and the production alias is the surface users actually hit.
#
# What a red run means: STOP-SHIP until a human reads it. A failed assertion
# marked as a leak means cross-org data was visible on the production API. Do
# not merge anything else, do not re-run and hope. Read the "Run org-isolation
# checks" step log first: the preflight lines and any DIAGNOSIS block explain
# whether the failure is an SSO gate/config issue (fix the setup) or a real
# isolation breach (stop-ship). The same pass/fail table is written to the job
# summary.
#
# Point API_BASE at the PRODUCTION deploy — preview deployments have Vercel
# Authentication (SSO) in front, which blocks Bearer-authenticated API calls.
#
# Required repo secrets (minimal set):
#   SUPABASE_ANON_KEY        the publishable/anon key
#   API_BASE                 production deploy base, e.g. https://<prod>.vercel.app
#   KANSAS_USER_PASSWORD     password for testkansas@minted.com     (Kansas-only, admin)
#   SOUTHPARK_USER_PASSWORD  password for testsouthpark@minted.com  (South Park-only, billing)
# Optional repo secret:
#   VERCEL_AUTOMATION_BYPASS_SECRET  a Vercel "Protection Bypass for Automation"
#     secret. Set this only if the deploy has Deployment Protection (SSO) on — the
#     script then sends x-vercel-protection-bypass so requests reach the app.
#
# Both test users are single-org, so the normal views send no x-org-id; the only
# x-org-id in the test is the assertion-4 spoof (Kansas user reaching for South Park).

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Override API_BASE for this run (defaults to the API_BASE secret)"
        required: false
        type: string
  deployment_status:

jobs:
  # Logs what the deploy integration actually reported, for every
  # deployment_status event (preview and production, any state). This is the
  # ground truth for the `verify` guard below — if Vercel ever changes its
  # environment naming, this job's log shows the new string.
  deployment-context:
    name: Log deployment event context
    if: github.event_name == 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - name: Echo deployment environment
        env:
          DS_STATE: ${{ github.event.deployment_status.state }}
          DS_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DS_ENV_URL: ${{ github.event.deployment_status.environment_url }}
          DS_SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "deployment_status.state          = ${DS_STATE}"
          echo "deployment.environment           = ${DS_ENVIRONMENT}"
          echo "deployment_status.environment_url = ${DS_ENV_URL}"
          echo "deployment.sha                   = ${DS_SHA}"

  verify:
    name: Provider API org isolation
    # Run for: manual dispatch, or a SUCCESSFUL PRODUCTION deployment. The
    # environment match is a case-insensitive contains() so both "Production"
    # and "Production – <project>" qualify; preview environments never do.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run org-isolation checks
        env:
          # --- fixed, non-secret constants ---
          SUPABASE_URL: https://fkvuhfsqcmujywzgczmc.supabase.co
          KANSAS_EMAIL: testkansas@minted.com
          SPVIEW_EMAIL: testsouthpark@minted.com
          # Only the assertion-4 spoof needs an org id (Kansas user reaching for South Park).
          SOUTHPARK_ORG: d0e40000-0000-4000-a000-000000000001
          SOUTHPARK_PROVIDER_ID: d0e40000-0000-4000-a000-000000000021
          KANSAS_PROVIDER_ID: 49ad83a8-d8b6-419d-8dcc-88c04a54c4da
          # LIVE demo-org provider counts for assertions 1/2 (script defaults
          # 6/4 match the mock fixtures). Demo data moves — adding/removing a
          # demo or UAT provider changes these; update the number HERE, not in
          # the script. A stale count fails assertion 1/2 as fixture drift,
          # never as a leak (the leak checks are 1b/2b/2c/3). Went 6 -> 7 on
          # 2026-07-05 when "UAT: Test Provider" was added to Kansas.
          EXPECTED_KANSAS_PROVIDERS: "7"
          EXPECTED_SOUTHPARK_PROVIDERS: "4"
          # Chunk 4 fixtures. SOUTHPARK_FIELDMAP_ID is the ONE South
          # Park-scoped portal_field_maps row (portal_key sp_test_portal,
          # status proposed), seeded via Supabase MCP on 2026-07-05 so the
          # "Kansas cannot read South Park field maps" assertion isn't vacuous.
          # Assertion 5a proves the row still exists (South Park's own view);
          # if it is ever reseeded, update this id — a stale id fails 5a as a
          # fixture error, not a leak. SOUTHPARK_CASE_ID is a South Park
          # credential_cases row for the must-reject fill-event POST.
          SOUTHPARK_FIELDMAP_ID: 468238fc-ab35-4a4d-9569-bb7960f40328
          SOUTHPARK_CASE_ID: d0e40000-0000-4000-a000-000000000065
          # SOUTHPARK_FACILITY_ID is a South Park facilities row ("Casa Bonita
          # Clinic", demo data): assertion 11 proves a Kansas profile request
          # naming it as ?facilityId is a 404, never a token source.
          SOUTHPARK_FACILITY_ID: d0e40000-0000-4000-a000-000000000011
          # Assertion 13 (PR C, submission-touch task-ownership isolation):
          # KANSAS_CASE_ID is a real Kansas credential_cases row (the valid POST
          # target), SOUTHPARK_TASK_ID a real South Park tasks row (the cross-org
          # task_id that must 404 before any write). Both are demo data; the task
          # check runs before the anchor insert, so this never writes to the
          # Kansas case. A stale id fails 13 as a fixture error, not a leak.
          KANSAS_CASE_ID: 07ab5b29-99b6-43d3-a41f-c231e99a9864
          SOUTHPARK_TASK_ID: 00f2ba06-644e-46f0-a224-a39c609dc40a
          # --- from secrets ---
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE: ${{ github.event.inputs.api_base || secrets.API_BASE }}
          KANSAS_PASSWORD: ${{ secrets.KANSAS_USER_PASSWORD }}
          SPVIEW_PASSWORD: ${{ secrets.SOUTHPARK_USER_PASSWORD }}
          # Optional — only needed if the deploy has Vercel Deployment Protection on.
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-org-isolation.mjs
